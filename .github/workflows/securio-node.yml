name: SECURIO Node.js
on:
  pull_request:
    paths: ['node-app/**', '.github/workflows/securio-node.yml']
  push:
    branches: ['securio/node-app']
    paths: ['node-app/**', '.github/workflows/securio-node.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:integration
      - run: docker build -t securio-node:ci .
